[project]
name = "banking-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Romero", email = "infoslack@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "guardrails-ai>=0.11.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
banking-ai = "banking_ai:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anti-slop-py>=0.1.1",
    "flake8>=7.3.0",
    "flake8-pydantic>=0.4.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# anti-slop-py layer 1 (core + FastAPI group).
extend-select = [
    "ANN401", # bans `Any` in parameters and returns
    "PGH003", # bans blanket `# type: ignore`
    "B009",   # bans getattr with a constant name
    "B010",   # bans setattr with a constant name
    "TID251", # banned APIs, listed below
    "FAST",   # FAST001 redundant response_model, FAST002 non-Annotated Depends, FAST003 unused path parameter
    "ASYNC",  # blocking I/O inside async routes
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock.patch".msg = "Module mocking hides real seams; inject the dependency instead (anti-slop no-module-mocking)."
# typing.Any is not banned here: mypy disallow_any_explicit already covers it.

[tool.mypy]
# anti-slop-py layer 2: explicit strict flags scoped to owned source.
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Guardrails AI não publica py.typed; o que sai dele é parseado com Pydantic na fronteira.
module = ["guardrails", "guardrails.*", "guardrails_ai.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
